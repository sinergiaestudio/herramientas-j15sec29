<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Vista general de Herramientas SEC29</title>
  <desc id="desc">Cuatro módulos: actuaciones y vencimientos, actuaciones en lote, lotes de cédulas y confronte EJF.</desc>
  <defs>
